<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Motocicleta</title>
    <!-- Agregamos Bootstrap para que se vea bien -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h3 class="mb-0">🏍️ Registrar Nueva Motocicleta</h3>
                </div>
                <div class="card-body">
                    <!-- Aquí se genera el formulario de Django -->
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success">Guardar Motocicleta</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
