<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Kaneda Ōtobai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-carmesi: #7a172c;
            --rojo-kaneda: #c2253b;
            --fondo-mate: #dfd5ce;
        }
        body { background-color: var(--fondo-mate); font-family: 'Segoe UI', Arial, sans-serif; margin: 0; }
        
        /* Navbar Carmesí Unificado */
        .navbar { background-color: var(--bg-carmesi) !important; padding: 1.2rem 0; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .navbar-brand { color: #ffffff !important; font-weight: 700; letter-spacing: 2px; }
        .nav-link { color: #e8b4bc !important; transition: 0.3s; margin-left: 1rem; }
        .nav-link:hover { color: #ffffff !important; }
        
        /* Diseño de la Portada */
        .portada {
            /* Resta la altura del navbar para ocupar exactamente el resto de la pantalla */
            height: calc(100vh - 76px); 
            /* Imagen de fondo con filtro oscuro para que las letras resalten */
            background-image: linear-gradient(rgba(31, 24, 34, 0.8), rgba(122, 23, 44, 0.6)), url('https://images.unsplash.com/photo-1558980663-3685c1d673c4?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            animation: aparecerSuave 0.8s ease-out forwards;
        }

        @keyframes aparecerSuave {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .btn-entrar {
            background-color: var(--rojo-kaneda);
            color: #ffffff;
            border-radius: 8px;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        .btn-entrar:hover {
            background-color: #ffffff;
            color: var(--rojo-kaneda);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <!-- El logo ahora lleva a la página de inicio -->
            <a class="navbar-brand d-flex align-items-center" href="{% url 'inicio' %}">
                <img src="https://img.icons8.com/ios-filled/50/ffffff/motorcycle.png" alt="Logo" width="32" height="32" class="me-2">
                KANEDA ŌTOBAI
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'listar_motos' %}">Inventario</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'crear_moto' %}">Nuevo Registro</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="portada">
        <div class="container px-4">
            <h1 class="display-3 fw-bold mb-3 shadow-sm">KANEDA ŌTOBAI</h1>
            <p class="lead mb-4 fs-4 text-light">Sistema integral de administración de inventario y control de stock</p>
            <!-- Este botón usa la magia de Django para buscar la ruta del catálogo automáticamente -->
            <a href="{% url 'listar_motos' %}" class="btn-entrar shadow">Ingresar al Catálogo</a>
        </div>
    </div>

</body>
</html>
